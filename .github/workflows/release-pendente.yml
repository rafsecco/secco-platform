name: Release pendente

# Vigia semanal do buraco inverso ao do publish-packages.yml.
#
# Aquele workflow garante que uma tag empurrada vire pacote. Este responde a pergunta que
# ninguem estava fazendo: existe codigo entregue em main que nunca virou pacote?
#
# O motivo e concreto. O Secco.SDK.Logging 0.1.0 ficou no feed compilado contra o
# Secco.LogStream.Client 0.2.0, chamando um metodo que a 0.3.0 renomeou. Quem instalasse os
# dois na versao mais recente recebia MissingMethodException no despacho do lote - capturado
# pelo dispatcher por design (ADR-0008), entao o sintoma nao era processo caido: era log que
# nao chegava. A correcao ja estava em main havia um dia; o que faltou foi publicar.
#
# Atraso entre merge e release e normal. Esquecimento nao e - e a diferenca entre os dois so
# aparece se alguem olhar de tempos em tempos.

on:
  schedule:
    # Segunda-feira, 12:00 UTC (09:00 BRT) - inicio de semana, antes de a semana empilhar.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-pendente
  cancel-in-progress: false

jobs:
  levantamento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # O script compara <tag>..HEAD por diretorio de projeto: sem historico completo e
          # sem as tags nao ha o que comparar.
          fetch-depth: 0

      - name: Levantar pacotes com fonte por publicar
        id: levantamento
        run: |
          set +e
          relatorio=$(python3 scripts/check-release-chain.py --pendentes)
          codigo=$?
          set -e

          echo "$relatorio"

          {
            echo "relatorio<<FIM_DO_RELATORIO"
            echo "$relatorio"
            echo "FIM_DO_RELATORIO"
          } >> "$GITHUB_OUTPUT"

          if [ "$codigo" -eq 0 ]; then
            echo "pendente=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pendente=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Garantir o rotulo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create release-pendente \
            --description "Pacote com codigo entregue e nao publicado" \
            --color "D93F0B" \
            --force

      - name: Abrir ou atualizar a issue
        if: steps.levantamento.outputs.pendente == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          RELATORIO: ${{ steps.levantamento.outputs.relatorio }}
          REPO: ${{ github.repository }}
        run: |
          corpo=$(cat <<CORPO
          O levantamento semanal encontrou pacote publicavel com **fonte alterada desde a propria tag**.

          \`\`\`
          $RELATORIO
          \`\`\`

          Publicar exige tag no commit sendo empacotado para **cada dependencia publicavel** (ADR-0011),
          inclusive as que nao mudaram - sem isso o MinVer resolve a dependencia como pre-release e o
          Pack falha com NU5104. Para ver a cadeia de um pacote:

          \`\`\`bash
          python scripts/check-release-chain.py <alvo>
          \`\`\`

          Esta issue fecha sozinha no proximo levantamento em que nao houver nada pendente.
          CORPO
          )

          existente=$(gh issue list --state open --label release-pendente \
            --json number --jq '.[0].number // empty')

          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$corpo"
            echo "Comentario adicionado a issue #$existente."
          else
            gh issue create \
              --title "Pacotes com codigo entregue e nao publicado" \
              --label release-pendente \
              --body "$corpo"
          fi

      - name: Fechar a issue quando nao ha pendencia
        if: steps.levantamento.outputs.pendente == 'nao'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existente=$(gh issue list --state open --label release-pendente \
            --json number --jq '.[0].number // empty')

          if [ -n "$existente" ]; then
            gh issue close "$existente" \
              --comment "Levantamento sem pendencia: todo publicavel esta com a fonte publicada."
            echo "Issue #$existente fechada."
          else
            echo "Nada pendente e nenhuma issue aberta."
          fi
