name: CI

# Path filters (ADR-0014): mudança só em LogStream builda só o LogStream;
# mudança em kernel/SDK/arquivos de build builda a solution inteira (dependentes incluídos).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      logstream: ${{ steps.filter.outputs.logstream }}
      securegate: ${{ steps.filter.outputs.securegate }}
      adminportal: ${{ steps.filter.outputs.adminportal }}
      notificationhub: ${{ steps.filter.outputs.notificationhub }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform:
              - 'src/SharedKernel/**'
              - 'src/SDK/**'
              - 'tests/SharedKernel/**'
              - 'tests/SDK/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - '.editorconfig'
              - 'Secco.Platform.slnx'
              - '.github/workflows/**'
            logstream:
              - 'src/LogStream/**'
              - 'tests/LogStream/**'
              # O LogStream consome o catálogo remoto via Secco.SecureGate.Client (Fase 6.3)
              - 'src/SecureGate/Secco.SecureGate.Client/**'
              - 'src/SecureGate/Secco.SecureGate.Api/openapi/**'
            securegate:
              - 'src/SecureGate/**'
              - 'tests/SecureGate/**'
              # Os testes E2E cross-produto do SecureGate embarcam o LogStream.Api real
              - 'src/LogStream/**'
            adminportal:
              - 'src/AdminPortal/**'
              - 'tests/AdminPortal/**'
              # O AdminPortal consome os clients do SecureGate e do LogStream (ADR-0006/0023/0024)
              - 'src/SecureGate/Secco.SecureGate.Client/**'
              - 'src/SecureGate/Secco.SecureGate.Api/openapi/**'
              - 'src/LogStream/Secco.LogStream.Client/**'
              - 'src/LogStream/Secco.LogStream.Api/openapi/**'
            notificationhub:
              - 'src/NotificationHub/**'
              - 'tests/NotificationHub/**'
            templates:
              - 'templates/**'

  build-all:
    # Kernel/SDK/build mudaram: tudo é rebuildado — consumidores validam a mudança
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # MinVer (ADR-0011) calcula versões a partir das tags e precisa do histórico completo
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Secco.Platform.slnx

      - name: Build
        run: dotnet build Secco.Platform.slnx --no-restore --configuration Release

      - name: Test
        # Testcontainers (ADR-0012) usa o Docker do runner ubuntu-latest
        run: dotnet test Secco.Platform.slnx --no-build --configuration Release --verbosity normal

  build-logstream:
    # Só o LogStream mudou: builda apenas o produto (a cadeia kernel/SDK entra por referência)
    needs: changes
    if: needs.changes.outputs.platform != 'true' && needs.changes.outputs.logstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test LogStream
        run: dotnet test tests/LogStream/Secco.LogStream.Tests/Secco.LogStream.Tests.csproj --configuration Release --verbosity normal

  build-securegate:
    # Só o SecureGate mudou: builda apenas o produto (a cadeia kernel/SDK entra por referência)
    needs: changes
    if: needs.changes.outputs.platform != 'true' && needs.changes.outputs.securegate == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test SecureGate
        run: dotnet test tests/SecureGate/Secco.SecureGate.Tests/Secco.SecureGate.Tests.csproj --configuration Release --verbosity normal

  build-adminportal:
    # Só o AdminPortal mudou: builda apenas o produto (a cadeia SDK/Client entra por referência)
    needs: changes
    if: needs.changes.outputs.platform != 'true' && needs.changes.outputs.adminportal == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test AdminPortal
        run: dotnet test tests/AdminPortal/Secco.AdminPortal.Tests/Secco.AdminPortal.Tests.csproj --configuration Release --verbosity normal

  build-notificationhub:
    # Só o NotificationHub mudou: builda apenas o produto (a cadeia kernel/SDK entra por referência)
    needs: changes
    if: needs.changes.outputs.platform != 'true' && needs.changes.outputs.notificationhub == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test NotificationHub
        run: dotnet test tests/NotificationHub/Secco.NotificationHub.Tests/Secco.NotificationHub.Tests.csproj --configuration Release --verbosity normal

  validate-template:
    # ADR-0013: divergência entre template e ADRs é bug — instancia, builda e testa o
    # produto gerado quando o template OU a plataforma (kernel/SDK) mudarem
    needs: changes
    if: needs.changes.outputs.templates == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Instantiate template
        run: |
          dotnet new install ./templates/secco-service
          dotnet new secco-service -n Secco.TemplateSmoke -o src/TemplateSmoke

      - name: Generate migrations (both engines)
        run: |
          dotnet tool restore
          dotnet restore src/TemplateSmoke/Secco.TemplateSmoke.Api/Secco.TemplateSmoke.Api.csproj
          dotnet ef migrations add Initial --project src/TemplateSmoke/Secco.TemplateSmoke.Migrations.SqlServer/Secco.TemplateSmoke.Migrations.SqlServer.csproj --output-dir Migrations
          dotnet ef migrations add Initial --project src/TemplateSmoke/Secco.TemplateSmoke.Migrations.Postgres/Secco.TemplateSmoke.Migrations.Postgres.csproj --output-dir Migrations

      - name: Test generated product
        env:
          SECCO_UPDATE_OPENAPI: "true"
        run: dotnet test src/TemplateSmoke/tests/Secco.TemplateSmoke.Tests/Secco.TemplateSmoke.Tests.csproj --configuration Release --verbosity normal

      - name: Build generated client from generated contract
        run: dotnet build src/TemplateSmoke/Secco.TemplateSmoke.Client/Secco.TemplateSmoke.Client.csproj --configuration Release

      - name: Build da imagem do produto gerado
        # O Dockerfile faz parte do template (ADR-0013): se ele quebra, todo produto novo
        # nasce quebrado. Contexto é a raiz do repositório, como nos demais produtos.
        run: docker build -f src/TemplateSmoke/Secco.TemplateSmoke.Api/Dockerfile -t secco-templatesmoke:ci .

  docker-stacks:
    # Dockerfiles e composes NÃO são exercitados por dotnet build/test: o contexto de build
    # da imagem é bem mais estreito que o repositório (só existe o que os COPY trazem) e o
    # compose carrega configuração própria (connection strings apontando para os serviços).
    # Sem este job, quebra de imagem ou de compose só aparece na máquina de quem sobe o
    # ambiente — foi exatamente assim que quatro defeitos passaram despercebidos.
    needs: changes
    if: >
      needs.changes.outputs.platform == 'true' ||
      needs.changes.outputs.logstream == 'true' ||
      needs.changes.outputs.securegate == 'true' ||
      needs.changes.outputs.notificationhub == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Um runner por produto: sem disputa de porta (todos os composes publicam 1433/8080)
      fail-fast: false
      matrix:
        include:
          - product: logstream
            compose: src/LogStream/docker-compose.yml
          - product: securegate
            compose: src/SecureGate/docker-compose.yml
          - product: notificationhub
            compose: src/NotificationHub/docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build e sobe o stack (${{ matrix.product }})
        run: docker compose -f ${{ matrix.compose }} up -d --build

      - name: Smoke — a API responde HTTP
        # Qualquer resposta HTTP basta: 401 já prova que subiu e está servindo (os endpoints
        # exigem autenticação). O que este passo pega é a API que NÃO sobe — migrations
        # falhando, connection string apontando para o lugar errado, container morrendo.
        run: |
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/health || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "API respondeu HTTP $code"
              exit 0
            fi
            sleep 3
          done
          echo "A API não respondeu em ~120s"
          exit 1

      - name: Diagnóstico (só em falha)
        if: failure()
        run: |
          docker compose -f ${{ matrix.compose }} ps -a
          docker compose -f ${{ matrix.compose }} logs --tail 100

      - name: Teardown
        if: always()
        run: docker compose -f ${{ matrix.compose }} down -v
