name: Publish NuGet

# Publicação disparada por tag (ADR-0011/0014): criar a tag = publicar o pacote.
# Padrão de tag por pacote (MinVer calcula a versão a partir dela):
#   sharedkernel/v1.2.0   → Secco.SharedKernel 1.2.0
#   sdk/v0.1.0            → Secco.SDK.AspNetCore 0.1.0
#   sdk-efcore/v0.1.0     → Secco.SDK.EntityFrameworkCore 0.1.0
#   sdk-testing/v0.1.0    → Secco.SDK.Testing 0.1.0
#   sdk-logging/v0.1.0    → Secco.SDK.Logging 0.1.0
#   logstream-client/v0.1.0 → Secco.LogStream.Client 0.1.0
#   notificationhub-client/v0.1.0 → Secco.NotificationHub.Client 0.1.0
#   securegate-client/v0.1.0 → Secco.SecureGate.Client 0.1.0

# ATENCAO ao empurrar varias tags: o GitHub IGNORA os gatilhos quando um unico push traz
# MAIS DE TRES tags - nenhum workflow roda, e nada avisa. Aconteceu em 2026-09-06 com a
# levada de seis; as tags entraram no remoto e pacote nenhum foi publicado. Empurre em levas
# de ate tres, na ordem de dependencia, ou use o disparo manual abaixo.
# https://github.com/orgs/community/discussions/56152

on:
  push:
    tags:
      - "sharedkernel/v*"
      - "sdk/v*"
      - "sdk-efcore/v*"
      - "sdk-testing/v*"
      - "sdk-logging/v*"
      - "logstream-client/v*"
      - "notificationhub-client/v*"
      - "securegate-client/v*"
      - "templates/v*"

  # Disparo manual: republica uma tag que ja existe. Existe porque, sem ele, a unica forma
  # de reexecutar uma publicacao era apagar e recriar a tag no remoto.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ja existente a publicar (ex.: sdk-logging/v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # No push a tag e a propria ref; no disparo manual vem da entrada. Tudo abaixo usa
      # SECCO_TAG, para que os dois caminhos sejam identicos daqui para frente.
      SECCO_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # MinVer precisa do histórico completo e das tags para calcular a versão
          fetch-depth: 0
          # No disparo manual o checkout precisa ser DA TAG: e dela que o MinVer tira a versao.
          ref: ${{ inputs.tag || github.ref }}

      - name: Map tag to project
        id: map
        run: |
          case "${SECCO_TAG}" in
            sharedkernel/v*) echo "project=src/SharedKernel/Secco.SharedKernel/Secco.SharedKernel.csproj" >> "$GITHUB_OUTPUT" ;;
            sdk/v*)          echo "project=src/SDK/Secco.SDK.AspNetCore/Secco.SDK.AspNetCore.csproj" >> "$GITHUB_OUTPUT" ;;
            sdk-efcore/v*)   echo "project=src/SDK/Secco.SDK.EntityFrameworkCore/Secco.SDK.EntityFrameworkCore.csproj" >> "$GITHUB_OUTPUT" ;;
            sdk-testing/v*)  echo "project=src/SDK/Secco.SDK.Testing/Secco.SDK.Testing.csproj" >> "$GITHUB_OUTPUT" ;;
            sdk-logging/v*)  echo "project=src/SDK/Secco.SDK.Logging/Secco.SDK.Logging.csproj" >> "$GITHUB_OUTPUT" ;;
            logstream-client/v*) echo "project=src/LogStream/Secco.LogStream.Client/Secco.LogStream.Client.csproj" >> "$GITHUB_OUTPUT" ;;
            notificationhub-client/v*) echo "project=src/NotificationHub/Secco.NotificationHub.Client/Secco.NotificationHub.Client.csproj" >> "$GITHUB_OUTPUT" ;;
            securegate-client/v*) echo "project=src/SecureGate/Secco.SecureGate.Client/Secco.SecureGate.Client.csproj" >> "$GITHUB_OUTPUT" ;;
            templates/v*)    echo "project=templates/Secco.Templates.csproj" >> "$GITHUB_OUTPUT" ;;
            *) echo "Tag ${SECCO_TAG} sem mapeamento de pacote" >&2; exit 1 ;;
          esac

      - name: Check release chain
        # Falha ANTES do Pack, dizendo qual tag falta. Sem isto, uma dependencia sem tag
        # estavel neste commit so aparece no fim, como NU5104 — que nao diz qual e (ADR-0011).
        run: python3 scripts/check-release-chain.py "${SECCO_TAG%%/v*}/v"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Secco.Platform.slnx

      - name: Build
        run: dotnet build Secco.Platform.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Secco.Platform.slnx --no-build --configuration Release

      - name: Pack
        # Sem --no-build: o pacote de templates NÃO está na slnx (só produtos buildáveis),
        # então o Build/Restore acima não o restaura — deixamos o pack restaurar/buildar o
        # projeto alvo (incremental para os que já estão na slnx).
        run: >
          dotnet pack ${{ steps.map.outputs.project }}
          --configuration Release --output ./artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
